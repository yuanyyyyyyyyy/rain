name = "rain-collector"
main = "worker.js"
compatibility_date = "2026-11-01"

# D1 绑定：先创建并填入真实 database_id
#   npx wrangler d1 create rain-collector
#   npx wrangler d1 execute rain-collector --remote --file schema.sql
#   npx wrangler secret put ADMIN_TOKEN   # 管理台读接口的 Bearer 密钥
#   npx wrangler secret put BREVO_API_KEY # 留言邮件通知（Brevo；不配置则只入库不发信）
#   npx wrangler secret put IP_SALT       # IP 哈希盐（2026-11-10 审计加固；建议 openssl rand -hex 16，不配置退回旧盐）
#   npx wrangler secret put TURNSTILE_SECRET_KEY # 人机验证（灰度）：配置后留言表单强制 Turnstile；
#                                         # site key 填 content/site.json 的 turnstileSiteKey，两者同时配置才生效
[[d1_databases]]
binding = "DB"
database_name = "rain-collector"
database_id = "81713b53-b3ac-4fad-96fd-1be1390e5fab"
migrations_dir = "migrations"

# Workers AI 绑定（2026-11-15 AI 分身）：无需密钥，免费层按 neurons 计量（每日额度见 CF 控制台）。
# 端点见 agent.js；被刷时置 [vars] AGENT_ON = "0" 后 wrangler deploy 一键下线（对外 404）。
[ai]
binding = "AI"

# 留言通知收件地址（非密钥，明文 var）；发件人 = 同一邮箱，需在 Brevo 后台验证一次
[vars]
OWNER_EMAIL = "m13237097902@163.com"
AGENT_ON = "1"
AGENT_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
