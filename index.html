<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="陈雨 — 软件工程专业 2027 届。关注 Java 后端开发、AI 应用与系统工程。个人作品集与项目档案。" />
    <!-- Open Graph（部署于 GitHub Pages /rain/；字体已自托管，见 src/main.js） -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="YUAN — Personal Archive" />
    <meta property="og:description" content="陈雨 — 软件工程专业 2027 届。Java 后端 / AI 应用 / 系统工程。个人作品集与项目档案。" />
    <meta property="og:url" content="https://yuanyyyyyyyyy.github.io/rain/" />
    <meta property="og:image" content="https://yuanyyyyyyyyy.github.io/rain/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://yuanyyyyyyyyy.github.io/rain/og-image.png" />
    <link rel="canonical" href="https://yuanyyyyyyyyy.github.io/rain/" />
    <!-- CSP（2026-11-10 审计加固；GitHub Pages 无法配响应头，用 meta 兜底）：
         站点零内联脚本、字体/图片全自托管，唯一外呼是 Worker 收集端。
         style-src 需 'unsafe-inline'（Vue 的 :style 内联样式属性）；dev 的 HMR ws 与 'self' 同源，现代浏览器可匹配。 -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://rain-collector.yuanyyyyyyyyy.workers.dev; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>YUAN — Personal Archive</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
