name: Deploy to GitHub Pages

# 2026-11-14 起站点主部署改为 Cloudflare Pages（yuan-archive.pages.dev），
# 本工作流去掉 push 触发、仅保留手动 dispatch，避免旧 GitHub Pages 站被并发更新造成双站漂移。
on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 多会话并发护栏：任何一端把仓库回退到旧树时，宁可让部署失败报警，
      # 也不能把旧版静默发布到线上（2026-11-10 事故）。
      - name: Guard against stale tree
        run: |
          set -e
          grep -q "48vw" src/pages/PhotographyPage.vue || { echo "::error::摄影页组件被回退（缺 srcset/sizes），拒绝部署"; exit 1; }
          grep -q "shotThumb" src/pages/ProjectDetailPage.vue || { echo "::error::详情页组件被回退（缺截图缩略图逻辑），拒绝部署"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          DEPLOY_BASE: /rain/
      # SPA 路由 fallback：GitHub Pages 对未知路径返回 404.html
      - name: Copy index.html to 404.html
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
