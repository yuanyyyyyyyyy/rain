server:
  port: 8081
  # 2026-11-10 审计加固：管理 API 只服务本机 Vite dev（5175），不向局域网暴露。
  # 如需远程访问：改回 0.0.0.0 并置于可信反代（TLS）之后，同时设 app.security.trust-proxy=true
  address: 127.0.0.1

spring:
  application:
    name: rain-admin-server
  profiles:
    active: local   # 数据源等敏感配置在 application-local.yml（不入 git）
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB    # Spring 默认 1MB，照片上传必须显式放大
      max-request-size: 40MB

# JWT 参数：secret 在 application-local.yml 覆盖
app:
  jwt:
    expire-minutes: 120
  security:
    # 限流键是否信任 X-Forwarded-For。XFF 客户端可伪造，只有确定部署在可信反代之后才置 true
    trust-proxy: false
  admin:
    # 首次建库时 admin 账号的初始口令；留空则随机生成并打印到控制台（仅一次）
    initial-password: ""
  storage:
    # 前台 public 目录绝对路径（机器相关，在 application-local.yml 覆盖）
    frontend-public-dir: ""
    # 上传原始文件留档目录（相对启动目录，已 gitignore）
    orig-dir: var/photos-orig
