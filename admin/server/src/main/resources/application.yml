server:
  port: 8081

spring:
  application:
    name: rain-admin-server
  profiles:
    active: local   # 数据源等敏感配置在 application-local.yml（不入 git）
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB    # Spring 默认 1MB，照片上传必须显式放大
      max-request-size: 40MB

# JWT 参数：secret 在 application-local.yml 覆盖
app:
  jwt:
    expire-minutes: 120
  admin:
    # 首次建库时 admin 账号的初始口令；留空则随机生成并打印到控制台（仅一次）
    initial-password: ""
  storage:
    # 前台 public 目录绝对路径（机器相关，在 application-local.yml 覆盖）
    frontend-public-dir: ""
    # 上传原始文件留档目录（相对启动目录，已 gitignore）
    orig-dir: var/photos-orig
